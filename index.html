<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4ead4"><title>Palavras Cruzadas — Passatempo</title>
<style>
:root{--paper:#fffaf0;--ink:#26352c;--green:#315b43;--red:#c65b43;--line:#d9c9a9;--gold:#e8b94f}
*{box-sizing:border-box}body{margin:0;background:#eee3cd;color:var(--ink);font-family:Georgia,'Times New Roman',serif}
header{background:var(--green);color:#fffaf0;padding:20px max(18px,calc((100vw - 1100px)/2));border-bottom:6px solid var(--gold)}
.brand{font-size:clamp(25px,4vw,38px);font-weight:bold;letter-spacing:.3px}.brand span{color:#f2ce72}
header p{margin:5px 0 0;font:14px Arial,sans-serif;opacity:.9}
main{max-width:1100px;margin:22px auto;padding:0 16px}.paper{background:var(--paper);border:1px solid var(--line);box-shadow:0 4px 14px #60451a18;padding:18px;border-radius:4px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;font:14px Arial,sans-serif}
select,button{font:inherit;border:1px solid #b8aa8e;border-radius:5px;padding:10px 12px;background:#fffdf7;color:var(--ink)}
button{cursor:pointer;font-weight:bold}button.primary{background:var(--green);color:white;border-color:var(--green)}button:hover{filter:brightness(.96)}
.layout{display:grid;grid-template-columns:minmax(280px,1.15fr) minmax(250px,.85fr);gap:18px}
.board-wrap{overflow:auto;border:1px solid var(--line);background:#e6dcc8;padding:10px;display:flex;justify-content:center;align-items:flex-start;min-height:300px}
#board{display:grid;gap:2px;background:#26352c;padding:2px;touch-action:manipulation}
.cell{width:clamp(24px,3.4vw,36px);height:clamp(24px,3.4vw,36px);position:relative;background:#fffaf0}
.cell.block{background:#26352c}.cell input{width:100%;height:100%;padding:0;text-align:center;text-transform:uppercase;border:0;background:transparent;font:bold 18px Arial,sans-serif;color:#23372a;outline:none;border-radius:0}
.cell input:focus,.cell.selected{background:#ffe69a}.cell.highlight{background:#f5e8be}.cell.correct{background:#d9ead3}.cell.incorrect{background:#f4c7c3}.num{position:absolute;top:1px;left:2px;font:9px Arial,sans-serif;color:#675c49;pointer-events:none}
.clues h3{margin:0 0 8px;color:var(--green);border-bottom:2px solid var(--gold);padding-bottom:6px;font-size:19px}
.clue-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.clue-list{list-style:none;padding:0;margin:0}.clue-list li{font:13px/1.35 Arial,sans-serif;padding:7px 5px;border-bottom:1px dotted var(--line);cursor:pointer}.clue-list li.active{background:#f8e7b8;border-radius:4px}.clue-list b{color:var(--green);margin-right:5px}
.status{font:14px Arial,sans-serif;padding:12px 0;display:flex;gap:12px;flex-wrap:wrap}.pill{background:#e9e0cb;padding:6px 9px;border-radius:20px}
#message{font:14px Arial,sans-serif;min-height:20px;color:var(--green);font-weight:bold}
footer{text-align:center;padding:20px;color:#6d634f;font:12px Arial,sans-serif}
@media(max-width:760px){
 body{min-height:100dvh}
 header{padding:14px 16px;border-bottom-width:4px}
 header p{font-size:12px;line-height:1.4}
 .layout{grid-template-columns:1fr;gap:14px}
 .clue-columns{grid-template-columns:1fr}
 .paper{padding:10px;border-radius:0}
 main{margin:8px auto;padding:0}
 .toolbar{gap:7px}
 .toolbar label{width:100%}
 .toolbar select{flex:1;min-width:100px}
 .toolbar button{flex:1;padding:11px 8px;min-height:42px;font-size:13px}
 .board-wrap{justify-content:flex-start;min-height:0;padding:7px;overflow:auto;-webkit-overflow-scrolling:touch}
 #board{gap:1px}
 .cell{width:clamp(22px,6vw,32px);height:clamp(22px,6vw,32px)}
 .cell input{font-size:16px;min-width:0}
 .num{font-size:8px}
 .clues h3{font-size:17px;margin-top:6px}
 .clue-list li{font-size:14px;padding:10px 7px;min-height:40px}
 .status{font-size:12px;gap:6px;padding:8px 0}
 .pill{padding:6px 8px}
 footer{padding:14px 10px}
}
body.fullscreen-fallback{position:fixed;inset:0;z-index:9999;overflow:auto;background:#eee3cd}
body.fullscreen-fallback main{max-width:1100px}
body.fullscreen-fallback .paper{min-height:calc(100dvh - 140px)}
@media(max-width:760px){body.fullscreen-fallback header{padding:10px 12px}body.fullscreen-fallback .brand{font-size:24px}body.fullscreen-fallback main{margin:4px auto}body.fullscreen-fallback .paper{min-height:calc(100dvh - 100px)}}
@media(orientation:landscape) and (max-width:900px){.layout{grid-template-columns:minmax(0,1fr) minmax(220px,.85fr)}.clue-columns{grid-template-columns:1fr 1fr}.cell{width:clamp(20px,4.5vh,30px);height:clamp(20px,4.5vh,30px)}}

</style></head>

function check(){
 if(!puzzle){$('message').textContent='Gere um novo diagrama para começar.';return;}
 let right=0,total=puzzle.placed.length;
 for(const p of puzzle.placed){
  let ok=true;
  for(let i=0;i<p.word.length;i++){
   const r=p.r+(p.dir==='down'?i:0),c=p.c+(p.dir==='across'?i:0);
   if((puzzle.grid[r][c].value||'')!==p.word[i])ok=false;
  }
  if(ok)right++;
 }
 document.querySelectorAll('#board .cell').forEach(el=>{
  const input=el.querySelector('input');if(!input)return;
  const r=Number(el.dataset.r),c=Number(el.dataset.c),cell=puzzle.grid[r][c],value=cell.value||'';
  el.classList.toggle('correct',!!value&&value===cell.letter);
  el.classList.toggle('incorrect',!!value&&value!==cell.letter);
 });
 $('message').textContent=right===total
  ?'Parabéns! Você completou todas as palavras!'
  :right+' de '+total+' palavras corretas. As letras incorretas estão destacadas em vermelho.';
}
function reveal(){if(!puzzle||!selected)return;for(let i=0;i<selected.word.length;i++){let r=selected.r+(selected.dir==='down'?i:0),c=selected.c+(selected.dir==='across'?i:0);puzzle.grid[r][c].value=selected.word[i];const el=document.querySelector('input[data-r="'+r+'"][data-c="'+c+'"]');if(el){el.value=selected.word[i];el.parentElement.classList.remove('incorrect','correct')}}updateProgress();$('message').textContent='Palavra revelada: '+selected.word}
function start(){makePuzzle();if(!puzzle){selected=null;$('board').innerHTML='';$('across').innerHTML='';$('down').innerHTML='';$('counter').textContent='Diagrama indisponível';$('progress').textContent='0% preenchido';$('message').textContent='Não foi possível montar este diagrama. Tente outro.';return}selected=puzzle.placed[0];direction='across';$('message').textContent='Escolha uma pista e preencha as letras nos quadrinhos.';render();focusCell(selected.r,selected.c)}
$('new').addEventListener('click',start);$('check').addEventListener('click',check);$('reveal').addEventListener('click',reveal);$('clear').addEventListener('click',()=>{if(!puzzle)return;puzzle.grid.flat().filter(Boolean).forEach(cell=>{cell.value=''});document.querySelectorAll('#board input').forEach(i=>{i.value='';i.parentElement.classList.remove('correct','incorrect')});updateProgress();$('message').textContent='Respostas limpas.'});$('level').addEventListener('change',start);
async function toggleFullscreen(){
 const body=document.body;
 if(body.classList.contains('fullscreen-fallback')){
  body.classList.remove('fullscreen-fallback');
  updateFullscreenButton();
  return;
 }
 try{
  if(document.fullscreenElement){
   await document.exitFullscreen();
  }else if(document.documentElement.requestFullscreen){
   await document.documentElement.requestFullscreen();
  }else{
   body.classList.add('fullscreen-fallback');
  }
 }catch(err){
  body.classList.add('fullscreen-fallback');
 }
 updateFullscreenButton();
}
function updateFullscreenButton(){
 const active=!!document.fullscreenElement||document.body.classList.contains('fullscreen-fallback');
 $('fullscreenBtn').textContent=active?'⤢ Sair da tela cheia':'⛶ Tela cheia';
 $('fullscreenBtn').setAttribute('aria-label',active?'Sair da tela cheia':'Ativar tela cheia');
}
$('fullscreenBtn').addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',updateFullscreenButton);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('fullscreen-fallback')){document.body.classList.remove('fullscreen-fallback');updateFullscreenButton()}});

start();
</script></body></html>
